<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: #fff; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display: block;
            color: #ffffff;
            font-size: 16px;
        }
        #file-selector {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            background: rgba(40, 40, 40, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        #loader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Initially hidden */
            justify-content: center;
            align-items: center;
            background-color: rgba(0,0,0,0.7);
            z-index: 200;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="file-selector">
        <label for="file-input">Select STL File: </label>
        <input type="file" id="file-input" accept=".stl">
    </div>
    <div id="info">Drag to rotate | Scroll to zoom | Right-click drag to pan</div>
    <div id="loader-container"><div class="loader"></div></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        // Import necessary Three.js components
        import * as THREE from 'three';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, mesh, controls;

        function init() {
            // --- Scene Setup ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // --- Camera Setup ---
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            // --- Renderer Setup ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.8);
            pointLight.position.set(50, 100, 100);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0xffffff, 0.5);
            pointLight2.position.set(-100, -50, -100);
            scene.add(pointLight2);
            
            // --- Controls ---
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 10;
            controls.maxDistance = 500;
            
            // --- File Input Handling ---
            const fileInput = document.getElementById('file-input');
            const loaderElement = document.getElementById('loader-container');
            
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) {
                    return;
                }

                loaderElement.style.display = 'flex'; // Show loader

                const reader = new FileReader();

                reader.addEventListener('load', (e) => {
                    const loader = new STLLoader();
                    const geometry = loader.parse(e.target.result);

                    // Remove old mesh if it exists
                    if (mesh) {
                        scene.remove(mesh);
                        mesh.geometry.dispose();
                        mesh.material.dispose();
                    }

                    // Material
                    const material = new THREE.MeshNormalMaterial({
                        flatShading: false
                    });

                    // Mesh
                    mesh = new THREE.Mesh(geometry, material);
                    
                    // Center and scale the geometry
                    geometry.center();
                    const box = new THREE.Box3().setFromObject(mesh);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 100 / maxDim;
                    mesh.scale.set(scale, scale, scale);

                    scene.add(mesh);
                    loaderElement.style.display = 'none'; // Hide loader
                });

                reader.addEventListener('error', () => {
                    loaderElement.innerHTML = 'Error reading file.';
                });

                reader.readAsArrayBuffer(file);
            });


            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize, false);
            
            // --- Start Animation Loop ---
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // --- Initialize ---
        init();
    </script>
</body>
</html>
